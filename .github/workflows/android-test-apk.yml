# Builds the Bible Buddies Android test app (APK) and publishes it at:
# https://github.com/ChristcareMarketingSolutions/Bible-Buddies/releases/tag/android-test
name: Android test app

on:
  push:
    branches: [main, ccr-ac9f89b4-kd12rq]
    paths:
      - "**.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "manifest.json"
      - "android-app/**"
      - ".github/workflows/android-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app tools
        run: npm ci

      - name: Copy the website into the app
        run: npm run sync

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../bible-buddies-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bible-buddies-test-apk
          path: bible-buddies-test.apk

      - name: Publish the test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: "Bible Buddies – Android test app"
          prerelease: true
          files: bible-buddies-test.apk
          body: |
            Test version of the Bible Buddies Android app, for trying on your own phone.

            **Install:** on your Android phone, tap **bible-buddies-test.apk** below, open it and allow "Install unknown apps" for your browser when asked.

            Built automatically from commit ${{ github.sha }} on ${{ github.ref_name }}.
